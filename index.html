<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0c0a09" />
<title>Melitia Master</title>
<style>
:root{--panel:rgba(28,25,23,.9);--line:rgba(68,64,60,.9);--text:#fafaf9;--muted:#d6d3d1;--gold:#d4a017}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{max-width:480px;margin:0 auto;padding:20px 16px 40px;background:#0c0a09 linear-gradient(180deg,rgba(80,10,40,.45),rgba(12,10,9,.95))}
header{text-align:center;padding:12px 0 20px}
.wordmark{font-size:22px;font-weight:700;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.tag{color:var(--muted);font-size:13px;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label.section{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.upload-zone{border:1.5px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;background:rgba(0,0,0,.25)}
.upload-zone:active{border-color:var(--gold)}
.upload-zone strong{display:block;color:var(--gold);font-size:16px;margin-bottom:6px}
.upload-zone span{color:var(--muted);font-size:13px}
#fileInput{display:none}
.file-name{margin-top:12px;font-size:13px;color:var(--muted);word-break:break-all}
.file-name.has{color:var(--text)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--muted);border-radius:12px;padding:12px 10px;font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none;text-align:left}
.preset.active{border-color:var(--gold);color:var(--gold);background:rgba(212,160,23,.18)}
.preset small{display:block;font-weight:400;font-size:11px;margin-top:4px;opacity:.85;line-height:1.3}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.toggle{border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--muted);border-radius:12px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none}
.toggle.on{border-color:var(--gold);color:var(--gold);background:rgba(212,160,23,.18)}
.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.primary{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;background:var(--gold);color:#1c1400;-webkit-appearance:none}
button.primary:disabled{opacity:.45}
button.ghost{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;background:rgba(28,25,23,.85);color:var(--text);-webkit-appearance:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.status{font-size:13px;color:var(--muted);line-height:1.5;min-height:1.5em;margin-top:12px;white-space:pre-wrap}
.status.ok{color:#86efac}.status.err{color:#fca5a5}
.hidden{display:none!important}
</style>
</head>
<body>
<header><div class="wordmark">Melitia Master</div><div class="tag">auto master · clean gain</div></header>
<div class="card"><label class="section">Your mix</label>
<div class="upload-zone" id="dropZone"><strong>Tap to upload</strong><span>WAV, MP3, M4A, FLAC, AIFF</span></div>
<input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.m4a,.flac,.aiff,.aif" />
<div class="file-name" id="fileName">No file selected</div></div>
<div class="card"><label class="section">Preset (or use Auto)</label>
<div class="presets" id="presetGrid"></div>
<div class="toggles">
<button type="button" class="toggle" id="depthBtn">Depth</button>
<button type="button" class="toggle" id="presenceBtn">Presence</button>
</div>
<p class="hint" id="presetHint"></p></div>
<div class="btn-row">
<button class="primary" id="autoBtn" disabled>Auto Master</button>
<button class="ghost" id="masterBtn" disabled>Master it</button>
</div>
<div class="actions hidden" id="actions">
<button class="primary" id="playBtn" type="button">Play</button>
<button class="ghost" id="downloadBtn" type="button">Download</button>
</div>
<div class="status" id="status"></div>
<audio id="player" class="hidden"></audio>
<script>
const PRESETS={Precise:{label:"Precise",blurb:"Clear · light polish",eq_gain_high:0.6,eq_gain_low:0.2,comp_threshold:-18,comp_ratio:1.3,limiter_boost:1.5,hint:"Light clarity and gentle glue."},Organic:{label:"Organic",blurb:"Barely touched",eq_gain_high:0,eq_gain_low:0,comp_threshold:-22,comp_ratio:1.15,limiter_boost:0.5,hint:"Almost transparent."},Elevated:{label:"Elevated",blurb:"Louder · still clean",eq_gain_high:1,eq_gain_low:0.6,comp_threshold:-16,comp_ratio:1.5,limiter_boost:2.5,hint:"More level, still clean."},Vocal:{label:"Vocal Glow",blurb:"Forward · airy",eq_gain_high:1.4,eq_gain_low:0.1,comp_threshold:-17,comp_ratio:1.4,limiter_boost:1.5,hint:"Opens the top a little."},Bass:{label:"808 Weight",blurb:"Low end · controlled",eq_gain_high:0.2,eq_gain_low:1.4,comp_threshold:-18,comp_ratio:1.35,limiter_boost:1.5,hint:"Supports sub cleanly."},Radio:{label:"Radio Punch",blurb:"Tight · mid focus",eq_gain_high:0.5,eq_gain_low:0.4,comp_threshold:-15,comp_ratio:1.6,limiter_boost:2,hint:"Tighter for small speakers."},Night:{label:"Night Drive",blurb:"Warm · soft",eq_gain_high:0.3,eq_gain_low:0.6,comp_threshold:-20,comp_ratio:1.2,limiter_boost:0.8,hint:"Warm, soft ceiling."},Raw:{label:"Raw Street",blurb:"Minimal",eq_gain_high:0.15,eq_gain_low:0.2,comp_threshold:-24,comp_ratio:1.1,limiter_boost:0.3,hint:"Near-bypass polish."}};
let style="Precise",depthOn=false,presenceOn=false,audioBuffer=null,masterBlob=null,masterUrl=null;
const grid=document.getElementById("presetGrid"),dropZone=document.getElementById("dropZone"),fileInput=document.getElementById("fileInput"),fileName=document.getElementById("fileName"),masterBtn=document.getElementById("masterBtn"),autoBtn=document.getElementById("autoBtn"),downloadBtn=document.getElementById("downloadBtn"),statusEl=document.getElementById("status"),player=document.getElementById("player"),depthBtn=document.getElementById("depthBtn"),presenceBtn=document.getElementById("presenceBtn"),presetHint=document.getElementById("presetHint"),actions=document.getElementById("actions"),playBtn=document.getElementById("playBtn");
Object.keys(PRESETS).forEach(key=>{const p=PRESETS[key],btn=document.createElement("button");btn.type="button";btn.className="preset"+(key===style?" active":"");btn.innerHTML=p.label+"<small>"+p.blurb+"</small>";btn.onclick=()=>{document.querySelectorAll(".preset").forEach(b=>b.classList.remove("active"));btn.classList.add("active");style=key;presetHint.textContent=p.hint};grid.appendChild(btn)});
presetHint.textContent=PRESETS[style].hint;
function setStatus(msg,kind){statusEl.textContent=msg;statusEl.className="status"+(kind?" "+kind:"")}
depthBtn.onclick=()=>{depthOn=!depthOn;depthBtn.classList.toggle("on",depthOn)};
presenceBtn.onclick=()=>{presenceOn=!presenceOn;presenceBtn.classList.toggle("on",presenceOn)};
dropZone.onclick=()=>fileInput.click();
fileInput.onchange=()=>{const f=fileInput.files&&fileInput.files[0];if(f)loadFile(f)};
async function loadFile(file){fileName.textContent=file.name;fileName.classList.add("has");masterBtn.disabled=true;autoBtn.disabled=true;actions.classList.add("hidden");player.pause();playBtn.textContent="Play";setStatus("Loading…");try{const ab=await file.arrayBuffer();const ctx=new(window.AudioContext||window.webkitAudioContext)();audioBuffer=await ctx.decodeAudioData(ab.slice(0));await ctx.close();masterBtn.disabled=false;autoBtn.disabled=false;setStatus("Ready · "+audioBuffer.numberOfChannels+" ch · "+audioBuffer.sampleRate+" Hz · "+audioBuffer.duration.toFixed(1)+"s")}catch(e){audioBuffer=null;setStatus("Could not read this file.\n"+e.message,"err")}}
function dbToLin(db){return Math.pow(10,db/20)}
function analyzeMix(buffer){const ch=buffer.numberOfChannels,len=buffer.length,sr=buffer.sampleRate;const mono=new Float32Array(len);for(let c=0;c<ch;c++){const d=buffer.getChannelData(c);for(let i=0;i<len;i++)mono[i]+=d[i]/ch}let peak=0,sumSq=0;for(let i=0;i<len;i++){const a=Math.abs(mono[i]);if(a>peak)peak=a;sumSq+=mono[i]*mono[i]}const rms=Math.sqrt(sumSq/len),crest=peak/(rms+1e-9);let lowE=0,highE=0,midE=0,lp=0,hp=0;const aL=Math.exp(-2*Math.PI*200/sr),aH=Math.exp(-2*Math.PI*4000/sr),step=Math.max(1,Math.floor(len/80000));let n=0;for(let i=0;i<len;i+=step){const x=mono[i];lp=aL*lp+(1-aL)*x;hp=aH*(hp+x-(mono[i-step]||0));const mid=x-lp;lowE+=lp*lp;highE+=hp*hp;midE+=mid*mid;n++}lowE/=n;highE/=n;midE/=n;const tot=lowE+midE+highE+1e-12;return{peak,rms,crest,lowRatio:lowE/tot,highRatio:highE/tot}}
function pickAutoRecipe(stats){let key="Precise",depth=false,presence=false,note="";if(stats.crest>8){key="Organic";note="Open dynamics → Organic"}else if(stats.crest<4.5){key="Raw";note="Dense mix → Raw polish"}else if(stats.highRatio<0.12){key="Vocal";presence=true;note="Dark top → Vocal + Presence"}else if(stats.lowRatio>0.45){key="Bass";note="Heavy low → 808 Weight"}else if(stats.rms<0.08&&stats.peak<0.5){key="Elevated";note="Quiet mix → Elevated"}else{key="Precise";note="Balanced → Precise"}return{key,depth,presence,note}}
function normalizePeak(buffer,targetPeak){let peak=0;for(let c=0;c<buffer.numberOfChannels;c++){const d=buffer.getChannelData(c);for(let i=0;i<d.length;i++){const a=Math.abs(d[i]);if(a>peak)peak=a}}if(peak<1e-6)return buffer;const scale=Math.min(1,targetPeak/peak);if(scale>=0.999)return buffer;const out=new AudioBuffer({length:buffer.length,numberOfChannels:buffer.numberOfChannels,sampleRate:buffer.sampleRate});for(let c=0;c<buffer.numberOfChannels;c++){const src=buffer.getChannelData(c),dst=out.getChannelData(c);for(let i=0;i<src.length;i++)dst[i]=src[i]*scale}return out}
async function runMaster(opts,label){masterBtn.disabled=true;autoBtn.disabled=true;setStatus("Mastering · "+label+"…");try{const offline=await renderMaster(audioBuffer,opts);if(masterUrl)URL.revokeObjectURL(masterUrl);masterBlob=bufferToWavBlob(offline);masterUrl=URL.createObjectURL(masterBlob);player.src=masterUrl;playBtn.textContent="Play";actions.classList.remove("hidden");setStatus("Done · "+label,"ok")}catch(e){setStatus("Master failed.\n"+e.message,"err")}finally{masterBtn.disabled=false;autoBtn.disabled=false}}
autoBtn.onclick=async()=>{if(!audioBuffer)return;setStatus("Analyzing mix…");await new Promise(r=>setTimeout(r,30));const stats=analyzeMix(audioBuffer);const recipe=pickAutoRecipe(stats);style=recipe.key;depthOn=recipe.depth;presenceOn=recipe.presence;depthBtn.classList.toggle("on",depthOn);presenceBtn.classList.toggle("on",presenceOn);document.querySelectorAll(".preset").forEach(b=>b.classList.remove("active"));const buttons=grid.querySelectorAll(".preset"),keys=Object.keys(PRESETS);keys.forEach((k,i)=>{if(k===style&&buttons[i])buttons[i].classList.add("active")});presetHint.textContent=recipe.note;const cfg=PRESETS[style];let high=cfg.eq_gain_high,low=cfg.eq_gain_low;if(depthOn)low+=1;if(presenceOn)high+=0.9;await runMaster({highDb:high,lowDb:low,threshold:cfg.comp_threshold,ratio:cfg.comp_ratio,makeupDb:cfg.limiter_boost,ceilingDb:-1},"Auto · "+PRESETS[style].label)};
masterBtn.onclick=async()=>{if(!audioBuffer)return;const cfg=PRESETS[style];let high=cfg.eq_gain_high,low=cfg.eq_gain_low;if(depthOn)low+=1;if(presenceOn)high+=0.9;const name=PRESETS[style].label+(depthOn?" + Depth":"")+(presenceOn?" + Presence":"");await runMaster({highDb:high,lowDb:low,threshold:cfg.comp_threshold,ratio:cfg.comp_ratio,makeupDb:cfg.limiter_boost,ceilingDb:-1},name)};
playBtn.onclick=async()=>{if(!masterUrl)return;try{if(player.paused){await player.play();playBtn.textContent="Pause"}else{player.pause();playBtn.textContent="Play"}}catch(e){setStatus("Playback blocked. Tap Play again.\n"+e.message,"err")}};
player.onended=()=>{playBtn.textContent="Play"};
player.onpause=()=>{if(player.currentTime<player.duration)playBtn.textContent="Play"};
downloadBtn.onclick=async()=>{if(!masterBlob||!masterUrl){setStatus("Nothing to download yet.","err");return}const fname="melitia_master_"+style.toLowerCase()+".wav";try{if(navigator.canShare&&navigator.canShare({files:[new File([masterBlob],fname,{type:"audio/wav"})]})){await navigator.share({files:[new File([masterBlob],fname,{type:"audio/wav"})],title:fname});setStatus("Shared · Save to Files","ok");return}}catch(e){if(e&&e.name==="AbortError")return}try{const w=window.open(masterUrl,"_blank");if(w){setStatus("Opened · Share → Save to Files","ok");return}}catch(e){}const a=document.createElement("a");a.href=masterUrl;a.download=fname;document.body.appendChild(a);a.click();a.remove();setStatus("Download started","ok")};
async function renderMaster(buffer,opts){buffer=normalizePeak(buffer,0.89);const sr=buffer.sampleRate,len=buffer.length,ch=buffer.numberOfChannels;const offline=new OfflineAudioContext(ch,len,sr);const source=offline.createBufferSource();source.buffer=buffer;let node=source;if(opts.lowDb!==0){const lowShelf=offline.createBiquadFilter();lowShelf.type="lowshelf";lowShelf.frequency.value=180;lowShelf.gain.value=opts.lowDb;node.connect(lowShelf);node=lowShelf}if(opts.highDb!==0){const highShelf=offline.createBiquadFilter();highShelf.type="highshelf";highShelf.frequency.value=10000;highShelf.gain.value=opts.highDb;node.connect(highShelf);node=highShelf}const comp=offline.createDynamicsCompressor();comp.threshold.value=opts.threshold;comp.knee.value=12;comp.ratio.value=opts.ratio;comp.attack.value=0.02;comp.release.value=0.18;node.connect(comp);const gain=offline.createGain();gain.gain.value=dbToLin(Math.min(opts.makeupDb,3));comp.connect(gain);gain.connect(offline.destination);source.start(0);const rendered=await offline.startRendering();const ceiling=dbToLin(opts.ceilingDb);const out=offline.createBuffer(ch,len,sr);for(let c=0;c<ch;c++){const src=rendered.getChannelData(c),dst=out.getChannelData(c);for(let i=0;i<len;i++)dst[i]=ceiling*Math.tanh(src[i]/(ceiling+1e-6))}return out}
function bufferToWavBlob(buffer){const numCh=buffer.numberOfChannels,sr=buffer.sampleRate,numFrames=buffer.length;const blockAlign=numCh*2,dataSize=numFrames*blockAlign;const ab=new ArrayBuffer(44+dataSize);const view=new DataView(ab);function writeStr(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i))}writeStr(0,"RIFF");view.setUint32(4,36+dataSize,true);writeStr(8,"WAVE");writeStr(12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,numCh,true);view.setUint32(24,sr,true);view.setUint32(28,sr*blockAlign,true);view.setUint16(32,blockAlign,true);view.setUint16(34,16,true);writeStr(36,"data");view.setUint32(40,dataSize,true);let offset=44;const channels=[];for(let c=0;c<numCh;c++)channels.push(buffer.getChannelData(c));for(let i=0;i<numFrames;i++){for(let c=0;c<numCh;c++){let s=Math.max(-1,Math.min(1,channels[c][i]));view.setInt16(offset,s<0?s*0x8000:s*0x7fff,true);offset+=2}}return new Blob([ab],{type:"audio/wav"})}
</script>
</body>
</html>
