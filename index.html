<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0c0a09" />
  <title>Melitia Master</title>
  <style>
    :root {
      --bg: #0c0a09;
      --panel: #1c1917;
      --line: #44403c;
      --text: #fafaf9;
      --muted: #a8a29e;
      --gold: #d4a017;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    body { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
    header { text-align: center; padding: 12px 0 20px; }
    .wordmark {
      font-size: 22px; font-weight: 700; letter-spacing: 0.2em;
      color: var(--gold); text-transform: uppercase;
    }
    .tag { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px; margin-bottom: 14px;
    }
    label.section {
      display: block; font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }
    .upload-zone {
      border: 1.5px dashed var(--line); border-radius: 14px;
      padding: 28px 16px; text-align: center; cursor: pointer;
    }
    .upload-zone:active { border-color: var(--gold); background: rgba(212,160,23,0.08); }
    .upload-zone strong { display: block; color: var(--gold); font-size: 16px; margin-bottom: 6px; }
    .upload-zone span { color: var(--muted); font-size: 13px; }
    #fileInput { display: none; }
    .file-name { margin-top: 12px; font-size: 13px; color: var(--muted); word-break: break-all; }
    .file-name.has { color: var(--text); }
    .presets { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .preset {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 12px; padding: 12px 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; -webkit-appearance: none;
    }
    .preset.active {
      border-color: var(--gold); color: var(--gold);
      background: rgba(212,160,23,0.12);
    }
    .preset small { display: block; font-weight: 400; font-size: 11px; margin-top: 4px; opacity: 0.8; }
    .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .toggle {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; -webkit-appearance: none;
    }
    .toggle.on {
      border-color: var(--gold); color: var(--gold);
      background: rgba(212,160,23,0.12);
    }
    .hint { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.4; }
    button.primary {
      width: 100%; border: 0; border-radius: 14px; padding: 16px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      background: var(--gold); color: #1c1400; -webkit-appearance: none;
    }
    button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
    button.ghost {
      width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 14px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      background: transparent; color: var(--text); margin-top: 10px; -webkit-appearance: none;
    }
    .status {
      font-size: 13px; color: var(--muted); line-height: 1.5;
      min-height: 1.5em; margin-top: 12px; white-space: pre-wrap;
    }
    .status.ok { color: #86efac; }
    .status.err { color: #fca5a5; }
    audio { width: 100%; margin-top: 12px; border-radius: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="wordmark">Melitia Master</div>
    <div class="tag">Waves-style presets · iPad</div>
  </header>

  <div class="card">
    <label class="section">Your mix</label>
    <div class="upload-zone" id="dropZone">
      <strong>Tap to upload</strong>
      <span>WAV, MP3, M4A, FLAC, AIFF</span>
    </div>
    <input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.m4a,.flac,.aiff,.aif" />
    <div class="file-name" id="fileName">No file selected</div>
  </div>

  <div class="card">
    <label class="section">Style</label>
    <div class="presets">
      <button type="button" class="preset active" data-style="Precise">
        Precise
        <small>Clear · stream</small>
      </button>
      <button type="button" class="preset" data-style="Organic">
        Organic
        <small>Gentle · open</small>
      </button>
      <button type="button" class="preset" data-style="Elevated">
        Elevated
        <small>Loud · push</small>
      </button>
    </div>
    <div class="toggles">
      <button type="button" class="toggle" id="depthBtn">Depth</button>
      <button type="button" class="toggle" id="presenceBtn">Presence</button>
    </div>
    <p class="hint" id="presetHint">Precise: balanced clarity, moderate glue, streaming loudness.</p>
  </div>

  <button class="primary" id="masterBtn" disabled>Master it</button>
  <button class="ghost hidden" id="downloadBtn">Download master</button>

  <div class="status" id="status"></div>
  <audio id="player" controls class="hidden"></audio>

  <script>
    const PRESETS = {
      Precise: {
        eq_gain_high: 1.2,
        eq_gain_low: 0.5,
        comp_threshold: -16,
        comp_ratio: 1.5,
        limiter_boost: 4.5,
        hint: "Precise: balanced clarity, moderate glue, streaming loudness."
      },
      Organic: {
        eq_gain_high: 0.0,
        eq_gain_low: 0.0,
        comp_threshold: -20,
        comp_ratio: 1.2,
        limiter_boost: 2.5,
        hint: "Organic: light touch. Keeps your mix dynamics."
      },
      Elevated: {
        eq_gain_high: 2.2,
        eq_gain_low: 1.5,
        comp_threshold: -12,
        comp_ratio: 2.0,
        limiter_boost: 6.0,
        hint: "Elevated: harder compression and commercial loudness."
      }
    };

    let style = "Precise";
    let depthOn = false;
    let presenceOn = false;
    let audioBuffer = null;
    let masterBlob = null;
    let masterUrl = null;

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const masterBtn = document.getElementById("masterBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusEl = document.getElementById("status");
    const player = document.getElementById("player");
    const depthBtn = document.getElementById("depthBtn");
    const presenceBtn = document.getElementById("presenceBtn");
    const presetHint = document.getElementById("presetHint");

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    document.querySelectorAll(".preset").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll(".preset").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        style = btn.dataset.style;
        presetHint.textContent = PRESETS[style].hint;
      };
    });

    depthBtn.onclick = () => {
      depthOn = !depthOn;
      depthBtn.classList.toggle("on", depthOn);
    };
    presenceBtn.onclick = () => {
      presenceOn = !presenceOn;
      presenceBtn.classList.toggle("on", presenceOn);
    };

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = () => {
      const f = fileInput.files && fileInput.files[0];
      if (f) loadFile(f);
    };

    async function loadFile(file) {
      fileName.textContent = file.name;
      fileName.classList.add("has");
      masterBtn.disabled = true;
      downloadBtn.classList.add("hidden");
      player.classList.add("hidden");
      setStatus("Loading…");
      try {
        const ab = await file.arrayBuffer();
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        audioBuffer = await ctx.decodeAudioData(ab.slice(0));
        await ctx.close();
        masterBtn.disabled = false;
        setStatus(
          "Ready · " +
          audioBuffer.numberOfChannels + " ch · " +
          audioBuffer.sampleRate + " Hz · " +
          audioBuffer.duration.toFixed(1) + "s"
        );
      } catch (e) {
        audioBuffer = null;
        setStatus("Could not read this file. Try WAV or M4A.\n" + e.message, "err");
      }
    }

    function dbToLin(db) { return Math.pow(10, db / 20); }

    masterBtn.onclick = async () => {
      if (!audioBuffer) return;
      masterBtn.disabled = true;
      setStatus("Mastering · " + style + (depthOn ? " + Depth" : "") + (presenceOn ? " + Presence" : "") + "…");
      try {
        const cfg = PRESETS[style];
        let high = cfg.eq_gain_high;
        let low = cfg.eq_gain_low;
        if (depthOn) low += 2.0;
        if (presenceOn) high += 1.8;

        const offline = await renderMaster(audioBuffer, {
          highDb: high,
          lowDb: low,
          threshold: cfg.comp_threshold,
          ratio: cfg.comp_ratio,
          makeupDb: cfg.limiter_boost,
          ceilingDb: -0.1,
        });

        if (masterUrl) URL.revokeObjectURL(masterUrl);
        masterBlob = bufferToWavBlob(offline);
        masterUrl = URL.createObjectURL(masterBlob);
        player.src = masterUrl;
        player.classList.remove("hidden");
        downloadBtn.classList.remove("hidden");
        setStatus("Done · " + style + (depthOn ? " · Depth" : "") + (presenceOn ? " · Presence" : ""), "ok");
      } catch (e) {
        setStatus("Master failed.\n" + e.message, "err");
      } finally {
        masterBtn.disabled = false;
      }
    };

    downloadBtn.onclick = () => {
      if (!masterBlob) return;
      const a = document.createElement("a");
      a.href = masterUrl;
      a.download = "melitia_master_" + style.toLowerCase() + ".wav";
      a.click();
    };

    async function renderMaster(buffer, opts) {
      const sr = buffer.sampleRate;
      const len = buffer.length;
      const ch = buffer.numberOfChannels;
      const offline = new OfflineAudioContext(ch, len, sr);

      const source = offline.createBufferSource();
      source.buffer = buffer;

      let node = source;

      if (opts.lowDb !== 0) {
        const lowShelf = offline.createBiquadFilter();
        lowShelf.type = "lowshelf";
        lowShelf.frequency.value = 200;
        lowShelf.gain.value = opts.lowDb;
        node.connect(lowShelf);
        node = lowShelf;
      }

      if (opts.highDb !== 0) {
        const highShelf = offline.createBiquadFilter();
        highShelf.type = "highshelf";
        highShelf.frequency.value = 12000;
        highShelf.gain.value = opts.highDb;
        node.connect(highShelf);
        node = highShelf;
      }

      const comp = offline.createDynamicsCompressor();
      comp.threshold.value = opts.threshold;
      comp.knee.value = 8;
      comp.ratio.value = opts.ratio;
      comp.attack.value = 0.03;
      comp.release.value = 0.1;
      node.connect(comp);

      const gain = offline.createGain();
      gain.gain.value = dbToLin(opts.makeupDb);
      comp.connect(gain);
      gain.connect(offline.destination);
      source.start(0);

      const rendered = await offline.startRendering();
      const ceiling = dbToLin(opts.ceilingDb);
      const out = offline.createBuffer(ch, len, sr);
      for (let c = 0; c < ch; c++) {
        const src = rendered.getChannelData(c);
        const dst = out.getChannelData(c);
        for (let i = 0; i < len; i++) {
          let s = src[i];
          if (s > ceiling) s = ceiling;
          if (s < -ceiling) s = -ceiling;
          dst[i] = s;
        }
      }
      return out;
    }

    function bufferToWavBlob(buffer) {
      const numCh = buffer.numberOfChannels;
      const sr = buffer.sampleRate;
      const numFrames = buffer.length;
      const blockAlign = numCh * 2;
      const dataSize = numFrames * blockAlign;
      const ab = new ArrayBuffer(44 + dataSize);
      const view = new DataView(ab);
      function writeStr(o, s) { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); }
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numCh, true);
      view.setUint32(24, sr, true);
      view.setUint32(28, sr * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, dataSize, true);
      let offset = 44;
      const channels = [];
      for (let c = 0; c < numCh; c++) channels.push(buffer.getChannelData(c));
      for (let i = 0; i < numFrames; i++) {
        for (let c = 0; c < numCh; c++) {
          let s = Math.max(-1, Math.min(1, channels[c][i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([ab], { type: "audio/wav" });
    }
  </script>
</body>
</html>
