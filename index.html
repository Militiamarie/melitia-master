<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Melitia Master — AI Online Mastering</title>
  <meta name="description" content="Melitia Master — Best-in-class AI online mastering. Clean, professional, distortion-free.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a; color: #fff; 
      min-height: 100vh; padding: 20px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 100%);
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 2.4rem; text-align: center; margin-bottom: 8px; background: linear-gradient(90deg, #ff00aa, #00aaff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 24px; font-size: 0.95rem; }
    .upload-area {
      border: 2px dashed #ff00aa; border-radius: 16px; padding: 36px 16px;
      text-align: center; margin-bottom: 16px; background: rgba(255,0,170,0.05);
      cursor: pointer; transition: all 0.3s;
    }
    .upload-area:hover, .upload-area.dragover { background: rgba(255,0,170,0.15); border-color: #00aaff; }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 12px 0 16px; }
    .presets button {
      background: #1a1a1a; color: #fff; border: 1px solid #ff00aa; padding: 10px 16px;
      border-radius: 24px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
    }
    .presets button.active, .presets button:hover { background: #ff00aa; }
    .controls { display: grid; gap: 12px; margin: 16px 0; }
    label { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #ccc; }
    input[type="range"] { width: 55%; accent-color: #ff00aa; }
    button.primary {
      background: #ff00aa; color: white; border: none; padding: 14px 28px;
      border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%;
    }
    button.primary:disabled { background: #333; cursor: not-allowed; }
    .status { text-align: center; margin: 12px 0; min-height: 22px; color: #00aaff; font-size: 0.95rem; }
    .original-play {
      margin: 12px 0; display: none;
    }
    .original-play button {
      width: 100%; padding: 14px; border-radius: 30px; border: none; font-weight: bold;
      background: #333; color: #fff; cursor: pointer; font-size: 1rem;
    }
    .original-play button:hover { background: #444; }
    .preview {
      margin-top: 20px; background: rgba(255,255,255,0.03); border-radius: 16px; padding: 16px;
    }
    .ab-controls { display: flex; gap: 10px; margin: 10px 0; }
    .ab-controls button { flex: 1; padding: 12px; border-radius: 24px; border: none; font-weight: 600; cursor: pointer; }
    .ab-controls .orig { background: #333; color: #fff; }
    .ab-controls .mast { background: #ff00aa; color: #fff; }
    .download-row { display: flex; gap: 10px; margin-top: 12px; }
    .download-row button { flex: 1; padding: 12px; border-radius: 24px; border: none; font-weight: 600; cursor: pointer; background: #1a1a1a; color: #fff; border: 1px solid #00aaff; }
    .download-row button:hover { background: #00aaff; }
    audio { width: 100%; margin: 8px 0; }
    footer { text-align: center; margin-top: 36px; color: #666; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Melitia Master</h1>
    <p class="subtitle">Best-in-class AI Mastering • Clean • Professional • Distortion-Free</p>

    <div class="upload-area" id="dropzone">
      <p>Drop your track here or tap to upload</p>
      <p style="font-size:0.8rem;color:#888;margin-top:6px;">Any audio file — WAV, MP3, AIFF, M4A, FLAC, etc.</p>
      <input type="file" id="fileInput" accept="*/*" hidden>
    </div>

    <div class="original-play" id="originalPlaySection">
      <button id="playOriginalNow">Play Original</button>
    </div>

    <div class="presets" id="presetBar">
      <button data-preset="sony" onclick="applyPreset('sony')">Sony</button>
      <button data-preset="theater" onclick="applyPreset('theater')">Theater</button>
      <button data-preset="club" onclick="applyPreset('club')">Club</button>
      <button data-preset="commercial" onclick="applyPreset('commercial')">Commercial</button>
      <button data-preset="radio" onclick="applyPreset('radio')">Radio</button>
      <button data-preset="live" onclick="applyPreset('live')">Live</button>
    </div>

    <div class="controls">
      <label>Loudness <span id="loudnessVal">0</span> dB
        <input type="range" id="loudness" min="-6" max="6" value="1" step="0.5">
      </label>
      <label>Bass <span id="bassVal">0</span>
        <input type="range" id="bass" min="-8" max="8" value="0" step="0.5">
      </label>
      <label>Mid <span id="midVal">0</span>
        <input type="range" id="mid" min="-6" max="6" value="0" step="0.5">
      </label>
      <label>Treble <span id="trebleVal">0</span>
        <input type="range" id="treble" min="-8" max="8" value="0" step="0.5">
      </label>
      <label>Presence <span id="presenceVal">0</span>
        <input type="range" id="presence" min="-5" max="5" value="0" step="0.5">
      </label>
      <label>Air <span id="airVal">0</span>
        <input type="range" id="air" min="-4" max="4" value="1" step="0.5">
      </label>
      <label>Compression <span id="compVal">2</span>
        <input type="range" id="comp" min="0" max="8" value="2" step="0.1">
      </label>
    </div>

    <button class="primary" id="processBtn" onclick="processTrack()" disabled>Master Track</button>

    <div class="status" id="status"></div>

    <div class="preview" id="preview" style="display:none;">
      <h3 style="margin-bottom:8px;">A/B Preview</h3>
      <div class="ab-controls">
        <button class="orig" id="playOrig">Play Original</button>
        <button class="mast" id="playMast">Play Mastered</button>
      </div>
      <audio id="originalAudio" controls></audio>
      <audio id="masteredAudio" controls></audio>
      <div class="download-row">
        <button onclick="downloadWAV()">Download WAV</button>
        <button onclick="downloadMP4()">Download MP4</button>
      </div>
    </div>

    <footer>
      Melitia Master • Best Clean Sound • No Distortion<br>
      Built for Melitia Marie • 818
    </footer>
  </div>

  <script>
    let audioContext, originalBuffer, processedBuffer, originalBlobUrl, masteredBlobUrl;
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    const originalPlaySection = document.getElementById('originalPlaySection');
    const originalAudio = document.getElementById('originalAudio');
    const masteredAudio = document.getElementById('masteredAudio');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
      status.textContent = 'Loading audio...';
      try {
        const arrayBuffer = await file.arrayBuffer();
        if (!audioContext) audioContext = new AudioContext();
        originalBuffer = await audioContext.decodeAudioData(arrayBuffer.slice(0));
        if (originalBlobUrl) URL.revokeObjectURL(originalBlobUrl);
        originalBlobUrl = URL.createObjectURL(file);
        originalAudio.src = originalBlobUrl;
        processBtn.disabled = false;
        originalPlaySection.style.display = 'block';
        preview.style.display = 'block';
        status.textContent = `Loaded: ${file.name} (${originalBuffer.duration.toFixed(1)}s)`;
      } catch (err) {
        status.textContent = 'Could not read this file as audio. Try WAV, MP3, M4A, or AIFF.';
        console.error(err);
      }
    }

    document.getElementById('playOriginalNow').addEventListener('click', () => {
      if (masteredAudio) masteredAudio.pause();
      originalAudio.currentTime = 0;
      originalAudio.play();
    });

    function applyPreset(name) {
      document.querySelectorAll('.presets button').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-preset="${name}"]`)?.classList.add('active');
      const presets = {
        sony:     { loudness: 1, bass: 0.5, mid: 0.3, treble: 1, presence: 0.5, air: 1.2, comp: 2 },
        theater:  { loudness: 1.5, bass: 2, mid: 0.5, treble: 1.5, presence: 1, air: 1.5, comp: 2.5 },
        club:     { loudness: 3, bass: 3.5, mid: 0.5, treble: 1, presence: 1.5, air: 1, comp: 4 },
        commercial:{ loudness: 2.5, bass: 1, mid: 1, treble: 2, presence: 1.5, air: 1.8, comp: 3.5 },
        radio:    { loudness: 3, bass: 0.5, mid: 1.5, treble: 2.5, presence: 2, air: 2, comp: 4 },
        live:     { loudness: 1.5, bass: 1, mid: 0.3, treble: 0.5, presence: 0.5, air: 0.8, comp: 2 }
      };
      const p = presets[name];
      if (!p) return;
      document.getElementById('loudness').value = p.loudness;
      document.getElementById('bass').value = p.bass;
      document.getElementById('mid').value = p.mid;
      document.getElementById('treble').value = p.treble;
      document.getElementById('presence').value = p.presence;
      document.getElementById('air').value = p.air;
      document.getElementById('comp').value = p.comp;
      updateLabels();
    }

    function updateLabels() {
      document.getElementById('loudnessVal').textContent = document.getElementById('loudness').value;
      document.getElementById('bassVal').textContent = document.getElementById('bass').value;
      document.getElementById('midVal').textContent = document.getElementById('mid').value;
      document.getElementById('trebleVal').textContent = document.getElementById('treble').value;
      document.getElementById('presenceVal').textContent = document.getElementById('presence').value;
      document.getElementById('airVal').textContent = document.getElementById('air').value;
      document.getElementById('compVal').textContent = document.getElementById('comp').value;
    }
    document.querySelectorAll('input[type="range"]').forEach(el => el.addEventListener('input', updateLabels));
    updateLabels();

    async function processTrack() {
      if (!originalBuffer) return;
      status.textContent = 'Mastering best sound...';
      processBtn.disabled = true;

      const offlineCtx = new OfflineAudioContext(
        originalBuffer.numberOfChannels,
        originalBuffer.length,
        originalBuffer.sampleRate
      );

      const source = offlineCtx.createBufferSource();
      source.buffer = originalBuffer;

      // Refined multi-band EQ for clarity and warmth without harshness
      const sub = offlineCtx.createBiquadFilter();
      sub.type = 'lowshelf';
      sub.frequency.value = 80;
      sub.gain.value = parseFloat(document.getElementById('bass').value) * 0.4;

      const bass = offlineCtx.createBiquadFilter();
      bass.type = 'peaking';
      bass.frequency.value = 120;
      bass.Q.value = 0.7;
      bass.gain.value = parseFloat(document.getElementById('bass').value) * 0.6;

      const lowmid = offlineCtx.createBiquadFilter();
      lowmid.type = 'peaking';
      lowmid.frequency.value = 400;
      lowmid.Q.value = 0.8;
      lowmid.gain.value = parseFloat(document.getElementById('mid').value) * 0.3;

      const mid = offlineCtx.createBiquadFilter();
      mid.type = 'peaking';
      mid.frequency.value = 1000;
      mid.Q.value = 0.7;
      mid.gain.value = parseFloat(document.getElementById('mid').value) * 0.5;

      const presence = offlineCtx.createBiquadFilter();
      presence.type = 'peaking';
      presence.frequency.value = 2800;
      presence.Q.value = 1;
      presence.gain.value = parseFloat(document.getElementById('presence').value) * 0.6;

      const treble = offlineCtx.createBiquadFilter();
      treble.type = 'highshelf';
      treble.frequency.value = 5000;
      treble.gain.value = parseFloat(document.getElementById('treble').value) * 0.7;

      const air = offlineCtx.createBiquadFilter();
      air.type = 'highshelf';
      air.frequency.value = 12000;
      air.gain.value = parseFloat(document.getElementById('air').value) * 0.8;

      const gain = offlineCtx.createGain();
      const loudness = parseFloat(document.getElementById('loudness').value);
      const comp = parseFloat(document.getElementById('comp').value);
      gain.gain.value = Math.pow(10, (loudness + comp * 0.12) / 20) * 0.82;

      source.connect(sub);
      sub.connect(bass);
      bass.connect(lowmid);
      lowmid.connect(mid);
      mid.connect(presence);
      presence.connect(treble);
      treble.connect(air);
      air.connect(gain);
      gain.connect(offlineCtx.destination);

      source.start();
      let rendered = await offlineCtx.startRendering();

      // Peak safety — never clip
      let peak = 0;
      for (let ch = 0; ch < rendered.numberOfChannels; ch++) {
        const data = rendered.getChannelData(ch);
        for (let i = 0; i < data.length; i++) {
          const abs = Math.abs(data[i]);
          if (abs > peak) peak = abs;
        }
      }
      if (peak > 0.9) {
        const scale = 0.9 / peak;
        for (let ch = 0; ch < rendered.numberOfChannels; ch++) {
          const data = rendered.getChannelData(ch);
          for (let i = 0; i < data.length; i++) data[i] *= scale;
        }
      }

      processedBuffer = rendered;

      const wav = bufferToWav(processedBuffer);
      const blob = new Blob([wav], { type: 'audio/wav' });
      if (masteredBlobUrl) URL.revokeObjectURL(masteredBlobUrl);
      masteredBlobUrl = URL.createObjectURL(blob);
      masteredAudio.src = masteredBlobUrl;

      status.textContent = 'Master complete — best clean sound';
      processBtn.disabled = false;
    }

    document.getElementById('playOrig').addEventListener('click', () => {
      masteredAudio.pause();
      originalAudio.currentTime = 0;
      originalAudio.play();
    });
    document.getElementById('playMast').addEventListener('click', () => {
      originalAudio.pause();
      masteredAudio.currentTime = 0;
      masteredAudio.play();
    });

    function bufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1;
      const bitDepth = 16;
      const samples = buffer.length;
      const blockAlign = numChannels * bitDepth / 8;
      const byteRate = sampleRate * blockAlign;
      const dataSize = samples * blockAlign;
      const bufferSize = 44 + dataSize;
      const arrayBuffer = new ArrayBuffer(bufferSize);
      const view = new DataView(arrayBuffer);

      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, format, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < samples; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
          offset += 2;
        }
      }
      return arrayBuffer;
    }

    function downloadWAV() {
      if (!masteredBlobUrl) return alert('Master a track first');
      const a = document.createElement('a');
      a.href = masteredBlobUrl;
      a.download = 'MelitiaMaster_Mastered.wav';
      a.click();
    }

    function downloadMP4() {
      if (!masteredBlobUrl) return alert('Master a track first');
      const a = document.createElement('a');
      a.href = masteredBlobUrl;
      a.download = 'MelitiaMaster_Mastered.mp4';
      a.click();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
