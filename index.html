<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0c0a09" />
  <title>Melitia Master</title>
  <style>
    :root {
      --bg: #0c0a09;
      --panel: #1c1917;
      --line: #44403c;
      --text: #fafaf9;
      --muted: #a8a29e;
      --gold: #d4a017;
      --gold-dim: #a16207;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    header {
      text-align: center;
      padding: 12px 0 20px;
    }
    .wordmark {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .tag {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    label.section {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .upload-zone {
      border: 1.5px dashed var(--line);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .upload-zone:active, .upload-zone.drag {
      border-color: var(--gold);
      background: rgba(212, 160, 23, 0.08);
    }
    .upload-zone strong {
      display: block;
      color: var(--gold);
      font-size: 16px;
      margin-bottom: 6px;
    }
    .upload-zone span {
      color: var(--muted);
      font-size: 13px;
    }
    #fileInput { display: none; }
    .file-name {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      word-break: break-all;
    }
    .file-name.has { color: var(--text); }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .row:last-child { margin-bottom: 0; }
    .row label {
      font-size: 14px;
      color: var(--text);
    }
    .row .val {
      font-size: 13px;
      color: var(--gold);
      min-width: 48px;
      text-align: right;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--gold);
      height: 28px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-appearance: none;
    }
    .btn-gold {
      background: var(--gold);
      color: #1c1400;
    }
    .btn-gold:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      margin-top: 10px;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      min-height: 1.5em;
      margin-top: 12px;
      white-space: pre-wrap;
    }
    .status.ok { color: #86efac; }
    .status.err { color: #fca5a5; }
    audio {
      width: 100%;
      margin-top: 12px;
      border-radius: 10px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="wordmark">Melitia Master</div>
    <div class="tag">iPad · browser · no install</div>
  </header>

  <div class="card">
    <label class="section">Your mix</label>
    <div class="upload-zone" id="dropZone">
      <strong>Tap to upload</strong>
      <span>WAV, MP3, M4A, FLAC, AIFF</span>
    </div>
    <input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.m4a,.flac,.aiff,.aif" />
    <div class="file-name" id="fileName">No file selected</div>
  </div>

  <div class="card">
    <label class="section">Controls</label>
    <div class="row">
      <label>High shelf</label>
      <span class="val" id="shelfVal">1.5 dB</span>
    </div>
    <input type="range" id="shelf" min="0" max="6" step="0.1" value="1.5" />

    <div class="row" style="margin-top:14px">
      <label>Makeup gain</label>
      <span class="val" id="makeupVal">5.0 dB</span>
    </div>
    <input type="range" id="makeup" min="0" max="12" step="0.5" value="5" />

    <div class="row" style="margin-top:14px">
      <label>Ceiling</label>
      <span class="val" id="ceilingVal">−0.1 dB</span>
    </div>
    <input type="range" id="ceiling" min="-1" max="-0.05" step="0.05" value="-0.1" />
  </div>

  <button class="btn-gold" id="masterBtn" disabled>Master it</button>
  <button class="btn-ghost hidden" id="downloadBtn">Download master</button>

  <div class="status" id="status"></div>
  <audio id="player" controls class="hidden"></audio>

  <script>
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const masterBtn = document.getElementById("masterBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusEl = document.getElementById("status");
    const player = document.getElementById("player");
    const shelf = document.getElementById("shelf");
    const makeup = document.getElementById("makeup");
    const ceiling = document.getElementById("ceiling");

    let audioBuffer = null;
    let masterBlob = null;
    let masterUrl = null;

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    shelf.oninput = () => { document.getElementById("shelfVal").textContent = Number(shelf.value).toFixed(1) + " dB"; };
    makeup.oninput = () => { document.getElementById("makeupVal").textContent = Number(makeup.value).toFixed(1) + " dB"; };
    ceiling.oninput = () => { document.getElementById("ceilingVal").textContent = Number(ceiling.value).toFixed(2) + " dB"; };

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = () => {
      const f = fileInput.files && fileInput.files[0];
      if (f) loadFile(f);
    };

    async function loadFile(file) {
      fileName.textContent = file.name;
      fileName.classList.add("has");
      masterBtn.disabled = true;
      downloadBtn.classList.add("hidden");
      player.classList.add("hidden");
      setStatus("Loading…");
      try {
        const ab = await file.arrayBuffer();
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        audioBuffer = await ctx.decodeAudioData(ab.slice(0));
        await ctx.close();
        masterBtn.disabled = false;
        setStatus(
          "Ready · " +
          audioBuffer.numberOfChannels + " ch · " +
          audioBuffer.sampleRate + " Hz · " +
          audioBuffer.duration.toFixed(1) + "s"
        );
      } catch (e) {
        audioBuffer = null;
        setStatus("Could not read this file. Try WAV or M4A.\n" + e.message, "err");
      }
    }

    function dbToLin(db) { return Math.pow(10, db / 20); }

    masterBtn.onclick = async () => {
      if (!audioBuffer) return;
      masterBtn.disabled = true;
      setStatus("Mastering…");
      try {
        const offline = await renderMaster(audioBuffer, {
          shelfDb: Number(shelf.value),
          makeupDb: Number(makeup.value),
          ceilingDb: Number(ceiling.value),
        });
        if (masterUrl) URL.revokeObjectURL(masterUrl);
        masterBlob = bufferToWavBlob(offline);
        masterUrl = URL.createObjectURL(masterBlob);
        player.src = masterUrl;
        player.classList.remove("hidden");
        downloadBtn.classList.remove("hidden");
        setStatus("Done. Play below or download.", "ok");
      } catch (e) {
        setStatus("Master failed.\n" + e.message, "err");
      } finally {
        masterBtn.disabled = false;
      }
    };

    downloadBtn.onclick = () => {
      if (!masterBlob) return;
      const a = document.createElement("a");
      a.href = masterUrl;
      a.download = "melitia_master.wav";
      a.click();
    };

    async function renderMaster(buffer, opts) {
      const sr = buffer.sampleRate;
      const len = buffer.length;
      const ch = buffer.numberOfChannels;
      const offline = new OfflineAudioContext(ch, len, sr);

      const source = offline.createBufferSource();
      source.buffer = buffer;

      const shelfFilter = offline.createBiquadFilter();
      shelfFilter.type = "highshelf";
      shelfFilter.frequency.value = 12000;
      shelfFilter.gain.value = opts.shelfDb;

      const comp = offline.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.knee.value = 8;
      comp.ratio.value = 1.5;
      comp.attack.value = 0.03;
      comp.release.value = 0.1;

      const gain = offline.createGain();
      gain.gain.value = dbToLin(opts.makeupDb);

      source.connect(shelfFilter);
      shelfFilter.connect(comp);
      comp.connect(gain);
      gain.connect(offline.destination);
      source.start(0);

      let rendered = await offline.startRendering();

      const ceilingLin = dbToLin(opts.ceilingDb);
      const out = offline.createBuffer(ch, len, sr);
      for (let c = 0; c < ch; c++) {
        const src = rendered.getChannelData(c);
        const dst = out.getChannelData(c);
        for (let i = 0; i < len; i++) {
          let s = src[i];
          if (s > ceilingLin) s = ceilingLin;
          if (s < -ceilingLin) s = -ceilingLin;
          dst[i] = s;
        }
      }
      return out;
    }

    function bufferToWavBlob(buffer) {
      const numCh = buffer.numberOfChannels;
      const sr = buffer.sampleRate;
      const numFrames = buffer.length;
      const bytesPerSample = 2;
      const blockAlign = numCh * bytesPerSample;
      const dataSize = numFrames * blockAlign;
      const ab = new ArrayBuffer(44 + dataSize);
      const view = new DataView(ab);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      }

      writeStr(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numCh, true);
      view.setUint32(24, sr, true);
      view.setUint32(28, sr * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, dataSize, true);

      let offset = 44;
      const channels = [];
      for (let c = 0; c < numCh; c++) channels.push(buffer.getChannelData(c));
      for (let i = 0; i < numFrames; i++) {
        for (let c = 0; c < numCh; c++) {
          let s = Math.max(-1, Math.min(1, channels[c][i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([ab], { type: "audio/wav" });
    }
  </script>
</body>
</html>
